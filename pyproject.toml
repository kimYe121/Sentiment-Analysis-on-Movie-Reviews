[project]
name = "movie-review-sentiment-analysis"
version = "0.1.0"
description = "Sentiment analysis project for Rotten Tomatoes movie review phrases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.3.0",
    "tqdm>=4.0.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "transformers>=4.38.0",
    "datasets>=2.14.0",
    "tokenizers>=0.14.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
